<nav class="navbar navbar-expand-md bg-body-tertiary shadow-sm">
  <div class="container">

    <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2">
      <i class="fa-solid fa-dice"></i>
      <span>DICEVA</span>
    </a>
<!--boton de hamburguesa solo se ve en los celulares-->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
            <i class="fa-solid fa-house me-1"></i>Inicio
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">
            <i class="fa-solid fa-store me-1"></i>Catálogo
          </a>
        </li>
        @if (authService.isAuthenticated()) {
          <li class="nav-item">
            <a routerLink="/comprar" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-cart-shopping me-1"></i>Comprar
            </a>
          </li>
        }
      </ul>

            <div class="d-flex gap-2 align-items-center">
        @if (authService.isAuthenticated()) {
                    <div class="usuario d-flex align-items-center gap-2 me-2">
            <span class="avatar">{{ authService.nombre().charAt(0) }}</span>
            <div class="lh-sm">
              <small class="text-muted d-block">Hola</small>
              <span class="fw-semibold">{{ authService.nombre() }}</span>
            </div>
          </div>
          <button class="btn btn-outline-danger btn-sm" (click)="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" class="btn btn-outline-primary btn-sm">
            <i class="fa-solid fa-right-to-bracket me-1"></i>Ingresar
          </a>
        }
      </div>
    </div>
